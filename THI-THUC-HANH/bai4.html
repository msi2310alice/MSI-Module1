<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        table {
            width: 70%;
            margin: 0 auto;
            border-collapse: collapse;
            border: 2px solid black;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        td:first-child,
        th:first-child {
            text-align: center;
            width: 50px;
        }

        tbody tr:nth-child(odd) {
            background-color: #e6e6e6;
        }
        
    </style>
</head>
<body>
    <H1>Quản lí công nhân</H1>
    <table>
        <thead>
            <th>STT</th>
            <th>Họ và Tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Lương</th>
            <th>Chức vụ</th>
        </thead>
        <tbody id="list"></tbody>
    </table>
    <script>
        class Worker{
            constructor(stt, ho_ten, ngay_sinh, dia_chi, luong, chuc_vu){
                this.stt = stt; 
                this.ho_ten = ho_ten;
                this.ngay_sinh =ngay_sinh;
                this.dia_chi = dia_chi;
                this.luong = luong;
                this.chuc_vu =chuc_vu;
            }
        }
        let A = new Worker(1, "Trương Tấn A", "11-11-1997", "Quảng Nam", 2000,"Abc");
        let B = new Worker(2, "Trương Tấn B", "11-11-1998", "Đà Nẵng", 2000, "Abc");
        let C = new Worker(3, "Trương Tấn C", "11-11-1999", "Huế", 2000, "Abc");
        let workers = [A,B,C];
        let hien_thi = document.getElementById("list");
        let text ="";
        for (let i = 0; i<workers.length; i++){
            text += `<tr>
                        <td>${workers[i].stt}</td>
                        <td>${workers[i].ho_ten}</td>
                        <td>${workers[i].ngay_sinh}</td>
                        <td>${workers[i].dia_chi}</td>
                        <td>${workers[i].luong}</td>
                        <td>${workers[i].chuc_vu}</td>
                    </tr>`;
        }
        hien_thi.innerHTML = text; 

    </script>
    
</body>
</html>
