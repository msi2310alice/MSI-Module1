<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function nhapSoNguyenDuong(){
            let x;
            do {
                x = parseInt(prompt("Nhập vào số nguyên dương: "));
                if (x<=0) {
                    alert("Hãy nhập lại số nguyên dương!");
                }
            } while ( x <= 0 || isNaN(x) );
            return x; 
        }
        function kiemTra(number){
            let sum =0;
            for (let i = 1; i<number; i++){
                if (number % i == 0){
                    sum += i;
                }
            }
            if (sum == number) {
                alert("Đây là số hoàn hảo!");
            } else {
                alert("Đây không phải số hoàn hảo!");
            }
        }
        kiemTra(nhapSoNguyenDuong());
    </script>
</body>
</html>
